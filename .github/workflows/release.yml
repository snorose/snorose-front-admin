name: Production Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# 여러 main 배포가 이어져도 대기 중인 릴리스 작업을 취소하지 않는다.
concurrency:
  group: production-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      checks: read
      contents: write
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Wait for deployment and publish release
        uses: actions/github-script@v7
        with:
          script: |
            const release = require('./.github/scripts/release.cjs');
            await release({ github, context, core });
