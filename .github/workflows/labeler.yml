name: "Labeler"

on:
  pull_request_target:
    types: [opened, edited]

jobs:
  pr-auto-labeler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # 코멘트 작성이 필요한 경우
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Label based on PR title
        uses: jimschubert/labeler-action@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config_path: .github/labeler.yml
